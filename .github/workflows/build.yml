name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this tag (e.g. v1.0.1); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icon.py
      - name: Build
        run: pyinstaller --noconfirm packaging/cueforge.spec
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\CueForge\CueForge.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content cueforge-self-test.log
          exit $p.ExitCode
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/CueForge.app/Contents/MacOS/CueForge --self-test
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\CueForge -DestinationPath CueForge-windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent CueForge.app ../CueForge-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CueForge-${{ runner.os }}
          path: CueForge-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name the files after the version
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          cd dist
          mv CueForge-windows.zip "CueForge-${tag}-windows.zip"
          mv CueForge-macos.zip "CueForge-${tag}-macos.zip"
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CueForge ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}
          files: dist/*.zip
          body: |
            ### Downloads
            - **Windows:** `CueForge-…-windows.zip`: unzip and run `CueForge\CueForge.exe`.
            - **macOS:** `CueForge-…-macos.zip`: unzip, move `CueForge.app` to Applications, and open it the first time with **right-click › Open** (the app isn't signed).

            The optional AI models (Beat This!, Demucs) are installed from inside the app: **AI › AI models…**.
