name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icon.py
      - name: Build
        run: pyinstaller --noconfirm packaging/cueforge.spec
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\CueForge\CueForge.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content cueforge-self-test.log
          exit $p.ExitCode
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/CueForge.app/Contents/MacOS/CueForge --self-test
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\CueForge -DestinationPath CueForge-windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent CueForge.app ../CueForge-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CueForge-${{ runner.os }}
          path: CueForge-*.zip
