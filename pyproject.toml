[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cueforge"
version = "1.0.0"
description = "Plan lighting hits and cues against audio, with AI suggestions you confirm. Exports to grandMA3."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "sounddevice>=0.4.6", "soxr>=0.3",
                "librosa>=0.10", "PySide6>=6.6", "mido>=1.3", "python-rtmidi>=1.5", "python-osc>=1.8",
                'pyobjc-framework-Cocoa>=9; sys_platform == "darwin"']

[project.optional-dependencies]
ai = ["torch", "torchaudio", "demucs>=4.0", "beat_this>=1.0"]
dev = ["pytest", "pyinstaller>=6.0"]

[project.gui-scripts]
cueforge = "cueforge.app:main"

[tool.setuptools.packages.find]
include = ["cueforge*"]

[tool.setuptools.package-data]
cueforge = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
